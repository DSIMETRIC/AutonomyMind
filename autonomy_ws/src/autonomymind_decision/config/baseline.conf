# AutonomyMind R9.16 certification-oriented baseline.
# All operational/behavioral numeric parameters are external to C++/Python/JavaScript.

numeric.unit_interval_min=0.0
numeric.unit_interval_max=1.0
numeric.epsilon=0.000000001
geometry.pi_rad=3.141592653589793238462643383279502884
geometry.heading_half_range_deg=180.0
geometry.heading_full_range_deg=360.0
authority.advisory_pct=0.0

alignment.calibration_s=2.0
alignment.min_samples=15

nav.minimum_operational_sources=1
nav.sources_required=2
nav.source_b_enabled=1
nav.filter_tau_s=0.75
nav.verify_enter_m=3.0
nav.verify_exit_m=1.5
nav.verify_enter_s=1.0
nav.verify_exit_s=2.0
nav.integrity_full_scale_m=8.0
nav.integrity_degrade_min=0.50
nav.integrity_hold_min=0.20
# A lone source cannot claim perfect integrity without an independent check.
nav.single_source_integrity=0.60

# Auditable ML advisory. The model ranks only candidates that have already
# passed trajectory feasibility and every Full-RTA safety gate. Low-confidence
# inference falls back to the deterministic minimum-separation selector.
ml.avoidance_ranker_enabled=1
ml.minimum_confidence=0.60
ml.avoidance_ranker_model=ml/avoidance_ranker_v1.model

mission.rejoin_enter_m=3.0
mission.rejoin_exit_m=1.0
mission.rejoin_heading_hold_deg=5.0

context.high_dynamics_speed_mps=12.0
context.high_dynamics_accel_mps2=4.0
context.high_dynamics_jerk_mps3=8.0
context.high_dynamics_yaw_rate_dps=25.0
context.vertical_transition_rate_mps=1.5

traffic.min_separation_m=15.0
traffic.prediction_horizon_s=8.0
traffic.prediction_dt_s=0.2
traffic.lateral_avoid_speed_mps=5.0
traffic.climb_avoid_speed_mps=3.0

# Development/demo trajectory shaping. LEFT/RIGHT use a coordinated-turn
# kinematic approximation, not a 6-DoF aerodynamic model.
traffic.maneuver_duration_s=4.0
traffic.turn_angle_deg=45.0
traffic.min_turn_speed_mps=1.0
physics.gravity_mps2=9.80665

# Full RTA baseline. Terrain is currently a flat reference plane and geofence
# is an axis-aligned 3-D operational volume. Replace these values with
# vehicle/mission-approved data before flight use.
rta.terrain_elevation_m=0.0
rta.min_terrain_clearance_m=20.0
rta.geofence_min_x_m=-1000.0
rta.geofence_max_x_m=1000.0
rta.geofence_min_y_m=-1000.0
rta.geofence_max_y_m=1000.0
rta.geofence_min_z_m=0.0
rta.geofence_max_z_m=1000.0
rta.max_speed_mps=50.0
rta.max_vertical_speed_mps=20.0
rta.max_accel_mps2=20.0
rta.max_jerk_mps3=50.0
rta.max_yaw_rate_dps=90.0
rta.max_bank_angle_deg=80.0

# Legacy limits retained temporarily for backward compatibility with older
# tooling. Full RTA uses the explicit rta.* envelope values above.
traffic.max_lateral_accel_mps2=4.0
traffic.max_vertical_accel_mps2=3.0
traffic.max_avoid_jerk_mps3=8.0
