# Overlay on compose.agents.host.yaml
services:
  world:
    image: autonomymind/agents:dev
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${AUTONOMYMIND_AGENT_DOMAIN:-79}"
    command: ["python3","-m","autonomymind_runtime.world_agent"]
    volumes: ["./semantic_data/outbox:/outbox"]
  world-probe:
    image: autonomymind/agents:dev
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "${AUTONOMYMIND_AGENT_DOMAIN:-79}"
    profiles: ["test"]
    command: ["python3","-m","autonomymind_runtime.world_probe"]
