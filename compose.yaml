services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: autonomymind/runtime:dev
    platform: ${AUTONOMYMIND_PLATFORM:-linux/amd64}
    command: ["demo","--scenario","/workspace/simulation/isaac/scenarios/obstacle_demo.json","--outbox","/workspace/semantic_data/outbox"]
    volumes:
      - ./semantic_data/outbox:/workspace/semantic_data/outbox

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: autonomymind/runtime:dev
    platform: ${AUTONOMYMIND_PLATFORM:-linux/amd64}
    entrypoint: ["/workspace/scripts/run_tests.sh"]

  contract-check:
    build:
      context: .
      dockerfile: Dockerfile
    image: autonomymind/runtime:dev
    platform: ${AUTONOMYMIND_PLATFORM:-linux/amd64}
    command: ["contract-check"]

  ros-test:
    build:
      context: .
      dockerfile: Dockerfile.ros
    image: autonomymind/ros:jazzy-dev
    platform: ${AUTONOMYMIND_PLATFORM:-linux/amd64}


  dynamic-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: autonomymind/runtime:dev
    platform: ${AUTONOMYMIND_PLATFORM:-linux/amd64}
    command:
      - dynamic-demo
      - --scenario
      - /workspace/simulation/isaac/scenarios/dynamic_crossing.json
      - --trace
      - /workspace/semantic_data/outbox/dynamic_trace.jsonl
    volumes:
      - ./semantic_data/outbox:/workspace/semantic_data/outbox


  cooperative-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: autonomymind/runtime:dev
    platform: ${AUTONOMYMIND_PLATFORM:-linux/amd64}
    command:
      - cooperative-demo
      - --scenario
      - /workspace/simulation/isaac/scenarios/cooperative_drone_rover.json

  industrial-pilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: autonomymind/runtime:dev
    platform: ${AUTONOMYMIND_PLATFORM:-linux/amd64}
    entrypoint: ["python","-m","autonomymind_runtime.industrial_pilot"]
    command: ["--scenario","/workspace/simulation/pilots/industrial_inspection.json","--output","/workspace/semantic_data/outbox/industrial_pilot.json"]
    volumes:
      - ./semantic_data/outbox:/workspace/semantic_data/outbox
