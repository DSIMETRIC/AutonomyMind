<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutonomyMind Mission Dashboard</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}
    header{padding:18px 24px;border-bottom:1px solid #333}
    main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
    section{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:14px}
    h1,h2{margin:0 0 10px}.wide{grid-column:1/-1}
    table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #333;text-align:left}
    .ok{color:#7ee787}.bad{color:#ff7b72}.pill{padding:3px 7px;border:1px solid #555;border-radius:999px}
    button{background:#2b2b2b;color:#eee;border:1px solid #555;border-radius:6px;padding:6px 10px}
    pre{white-space:pre-wrap;max-height:300px;overflow:auto}
  </style>
</head>
<body>
<header><h1>AutonomyMind Mission Dashboard</h1><div id="status">Loading trace…</div></header>
<main>
<section><h2>Replay</h2><button id="prev">◀</button> <button id="next">▶</button> <span id="step"></span></section>
<section><h2>Selected maneuver</h2><div id="maneuver" class="pill">—</div></section>
<section><h2>Robots</h2><table><thead><tr><th>ID</th><th>Type</th><th>Position</th></tr></thead><tbody id="robots"></tbody></table></section>
<section><h2>Tracks</h2><table><thead><tr><th>ID</th><th>Label</th><th>Position</th></tr></thead><tbody id="tracks"></tbody></table></section>
<section><h2>Assignments</h2><pre id="assignments"></pre></section>
<section><h2>Coordination</h2><pre id="coordination"></pre></section>
<section class="wide"><h2>Candidate decisions</h2><table><thead><tr><th>Maneuver</th><th>Priority</th><th>Confidence</th><th>Safety</th></tr></thead><tbody id="candidates"></tbody></table></section>
<section class="wide"><h2>Raw event</h2><pre id="raw"></pre></section>
</main>
<script src="app.js"></script>
</body></html>
