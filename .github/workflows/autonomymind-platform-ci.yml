name: AutonomyMind Platform CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'simulation/**'
      - 'semantic_data/**'
      - 'orchestration/contracts/**'
      - 'autonomy_ws/src/autonomymind_perception/**'
      - 'autonomy_ws/src/autonomymind_sensor_fusion/**'
      - 'autonomy_ws/src/autonomymind_tracking/**'
      - 'autonomy_ws/src/autonomymind_interfaces/**'
      - 'Dockerfile'
      - 'Dockerfile.ros'
      - 'Dockerfile.vision'
      - 'compose.yaml'
      - 'compose.vision.yaml'
      - 'deploy/**'
      - 'dashboard/**'
      - 'Dockerfile.dashboard'
      - 'compose.demo.yaml'
      - 'dashboard/**'
      - 'Dockerfile.dashboard'
      - 'compose.demo.yaml'
      - '.github/workflows/autonomymind-platform-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'simulation/**'
      - 'semantic_data/**'
      - 'orchestration/contracts/**'
      - 'autonomy_ws/src/autonomymind_perception/**'
      - 'autonomy_ws/src/autonomymind_sensor_fusion/**'
      - 'autonomy_ws/src/autonomymind_tracking/**'
      - 'autonomy_ws/src/autonomymind_interfaces/**'
      - 'Dockerfile'
      - 'Dockerfile.ros'
      - 'Dockerfile.vision'
      - 'compose.yaml'
      - 'compose.vision.yaml'
      - 'deploy/**'
      - '.github/workflows/autonomymind-platform-ci.yml'

jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runtime unit + integration + E2E
        run: docker compose run --rm test
      - name: Contract check
        run: docker compose run --rm contract-check
      - name: Reference demo
        run: docker compose run --rm demo

  vision-cpu-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU ONNX perception image
        run: docker build -f Dockerfile.vision -t autonomymind/vision:ci .
      - name: YOLO postprocess tests
        run: docker run --rm --entrypoint python autonomymind/vision:ci -m unittest discover -s /workspace/tests/vision -p 'test_*.py' -v

  dashboard-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build mission and dashboard images
        run: docker compose -f compose.demo.yaml build
      - name: Generate mission trace
        run: docker compose -f compose.demo.yaml run --rm mission
      - name: Start dashboard
        run: docker compose -f compose.demo.yaml up -d dashboard
      - name: Verify dashboard and trace
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ >/tmp/dashboard.html; then break; fi
            sleep 1
          done
          grep -q "AutonomyMind Mission Dashboard" /tmp/dashboard.html
          curl -fsS http://localhost:8080/trace/mission_trace.jsonl | grep -q '"event_type": "mission_step"'
      - name: Stop dashboard
        if: always()
        run: docker compose -f compose.demo.yaml down -v

  ros-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ROS Jazzy container tests
        run: docker compose run --rm ros-test

  multiarch-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Runtime image amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
      - name: ROS image amd64 + arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ros
          platforms: linux/amd64,linux/arm64
          push: false
