<!doctype html><meta charset="utf-8"><title>AutonomyMind Evasion</title><style>body{font:16px system-ui;background:#101820;color:#eee;max-width:900px;margin:32px auto}canvas{width:100%;background:#21303c}pre{white-space:pre-wrap}</style><h1>AutonomyMind · Gazebo reference evasion</h1><canvas id="map" width="900" height="420"></canvas><pre id="status">Waiting for simulator trace</pre><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),statusEl=document.querySelector('pre');const X=x=>80+x*110,Y=y=>250-y*110;
async function draw(){try{const d=await (await fetch('outbox/evasion.json',{cache:'no-store'})).json();g.clearRect(0,0,900,420);g.fillStyle='#ff9860';g.fillRect(X(3.75),Y(.25),55,55);g.strokeStyle='#6be4ad';g.lineWidth=3;g.beginPath();d.events.forEach((e,i)=>i?g.lineTo(X(e.x_m),Y(e.y_m)):g.moveTo(X(e.x_m),Y(e.y_m)));g.stroke();const e=d.events.at(-1);if(e){for(const a of e.options){g.strokeStyle=a.accepted?'#8acfff':'#f66';g.beginPath();a.x.forEach((x,i)=>i?g.lineTo(X(e.x_m+x),Y(e.y_m+a.y[i])):g.moveTo(X(e.x_m+x),Y(e.y_m+a.y[i])));g.stroke()}g.fillStyle='#fff';g.beginPath();g.arc(X(e.x_m),Y(e.y_m),8,0,Math.PI*2);g.fill();}statusEl.textContent=JSON.stringify({status:d.status,cycles:d.events.length,last:e},null,2)}catch(e){statusEl.textContent='Waiting for trace: '+e.message}}setInterval(draw,500);draw();
</script>
