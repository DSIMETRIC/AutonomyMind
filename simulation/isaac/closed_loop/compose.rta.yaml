services:
  simulation-rta:
    build:
      context: ../../..
      dockerfile: Dockerfile.ros
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${AUTONOMYMIND_SIM_DOMAIN_ID:-73}
    command: ["bash","-lc","source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 run autonomymind_decision simulation_rta_node --ros-args -r __ns:=/autonomymind_sim"]
